<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<title>デジタル栞 — Account Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1A1815; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="shared-components.jsx"></script>
<script type="text/babel" src="screens-account.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
function App() {
  return (
    <div style={{ width:'100vw', height:'100vh', background:'#1A1815' }}>
      <DesignCanvas>
        <DCSection id="account" title="アカウント設定 — 4 Screens">
          <DCArtboard id="main" label="メイン · 設定一覧" width={390} height={844}>
            <AccountScreen/>
          </DCArtboard>
          <DCArtboard id="icon" label="アイコン変更（ボトムシート）" width={390} height={844}>
            <IconPickerScreen/>
          </DCArtboard>
          <DCArtboard id="name" label="表示名の編集" width={390} height={844}>
            <DisplayNameScreen/>
          </DCArtboard>
          <DCArtboard id="delete" label="アカウント削除の確認" width={390} height={844}>
            <DeleteAccountScreen/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
