<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>デジタル栞 — Screen Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #E8E4DA; }
  /* Scrollbar polish */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 2px; }
  input { -webkit-appearance: none; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="shared-components.jsx"></script>
<script type="text/babel" src="screens-1-3.jsx"></script>
<script type="text/babel" src="screens-4-6.jsx"></script>
<script type="text/babel" src="screens-empty-states.jsx"></script>
<script type="text/babel" src="screens-improvements.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "bgColor": "#E8E4DA",
  "showLabels": true,
  "shellShadow": true
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [tweakOpen, setTweakOpen] = React.useState(false);

  React.useEffect(() => {
    window.addEventListener('message', e => {
      if (e.data?.type === '__activate_edit_mode')   setTweakOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweakOpen(false);
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  }, []);

  const screens = [
    { id:'s1', label:'01  Log in', component:<Screen01Login/> },
    { id:'s2', label:'02  本棚',   component:<Screen02Bookshelf/> },
    { id:'s3', label:'03  Book Detail', component:<Screen03Detail/> },
    { id:'s4', label:'04  Reading Timer', component:<Screen04Timer/> },
    { id:'s5', label:'05  本を追加', component:<Screen05AddBook/> },
    { id:'s6', label:'06  読書手帖', component:<Screen06Stats/> },
  ];

  return (
    <div style={{ width:'100vw', height:'100vh', background: tweaks.bgColor }}>
      <DesignCanvas>
        <DCSection id="screens" title="デジタル栞 — 6 Screens">
          {screens.map(s => (
            <DCArtboard key={s.id} id={s.id} label={s.label} width={390} height={844}>
              {s.component}
            </DCArtboard>
          ))}
        </DCSection>

        <DCSection id="typo" title="(a) 余白・タイポグラフィの磨き込み">
          <DCArtboard id="t1" label="01  Login — 改善版" width={390} height={844}>
            <ScreenTypoLogin/>
          </DCArtboard>
          <DCArtboard id="t2" label="03  Book Detail — 数字ヒーロー強化" width={390} height={844}>
            <ScreenTypoDetail/>
          </DCArtboard>
        </DCSection>

        <DCSection id="empty" title="(b) 空状態 — Empty States">
          <DCArtboard id="e1" label="02  本棚 — 0冊" width={390} height={844}>
            <ScreenEmptyBookshelf/>
          </DCArtboard>
          <DCArtboard id="e2" label="06  読書手帖 — 0件" width={390} height={844}>
            <ScreenEmptyStats/>
          </DCArtboard>
        </DCSection>

        <DCSection id="interactions" title="(c) インタラクション提案">
          <DCArtboard id="i1" label="スケルトンローディング" width={390} height={844}>
            <ScreenSkeleton/>
          </DCArtboard>
          <DCArtboard id="i2" label="タップ・プレス状態" width={390} height={844}>
            <ScreenTapStates/>
          </DCArtboard>
          <DCArtboard id="i3" label="画面遷移コンセプト" width={390} height={1020}>
            <ScreenTransitions/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      {/* Tweaks panel */}
      {tweakOpen && (
        <div style={{
          position:'fixed', bottom:24, right:24, zIndex:9999,
          background:'#fff', borderRadius:4,
          boxShadow:'0 4px 24px rgba(0,0,0,0.15)',
          padding:'20px 20px', width:240,
          fontFamily:'Zen Kaku Gothic New, sans-serif',
        }}>
          <div style={{ fontSize:11, letterSpacing:'0.18em', color:'#888',
            textTransform:'uppercase', marginBottom:16 }}>Tweaks</div>

          <label style={{ display:'block', marginBottom:12 }}>
            <div style={{ fontSize:11, color:'#666', marginBottom:6, letterSpacing:'0.05em' }}>Canvas background</div>
            <div style={{ display:'flex', gap:8 }}>
              {['#E8E4DA','#F0ECE2','#EAEAEA','#1A1A1A'].map(c => (
                <div key={c} onClick={() => {
                  setTweaks(t => ({...t, bgColor:c}));
                  window.parent.postMessage({type:'__edit_mode_set_keys', edits:{bgColor:c}},'*');
                }} style={{
                  width:28, height:28, borderRadius:'50%', background:c, cursor:'pointer',
                  border: tweaks.bgColor===c ? '2px solid #0A0A0A' : '1px solid rgba(0,0,0,0.12)',
                }}/>
              ))}
            </div>
          </label>

          <label style={{ display:'flex', alignItems:'center', justifyContent:'space-between', cursor:'pointer' }}>
            <span style={{ fontSize:11, color:'#666', letterSpacing:'0.05em' }}>Section labels</span>
            <div onClick={() => {
              const v = !tweaks.showLabels;
              setTweaks(t => ({...t, showLabels:v}));
              window.parent.postMessage({type:'__edit_mode_set_keys', edits:{showLabels:v}},'*');
            }} style={{
              width:36, height:20, borderRadius:10,
              background: tweaks.showLabels ? '#0A0A0A' : '#ccc',
              position:'relative', transition:'background 0.2s', cursor:'pointer',
            }}>
              <div style={{
                position:'absolute', top:2, left: tweaks.showLabels ? 18 : 2,
                width:16, height:16, borderRadius:'50%', background:'#fff',
                transition:'left 0.2s',
              }}/>
            </div>
          </label>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
